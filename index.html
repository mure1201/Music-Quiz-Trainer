<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Music Quiz Trainer</title>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#697386;--line:#d9e0ea;
  --accent:#3659c9;--ok:#167c4f;--ng:#b42318;--warn:#b54708
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:920px;margin:auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:24px;margin:0}
.version{font-size:12px;color:var(--muted);background:#eaf0ff;padding:6px 10px;border-radius:999px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 14px rgba(20,30,60,.05);margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select{font:inherit}
button{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:#e9edf5;color:var(--ink);font-weight:700}
button.primary{background:var(--accent);color:white}
button:disabled{opacity:.55;cursor:not-allowed}
select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:white}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;margin-top:4px}
.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.controls label{font-size:13px;color:var(--muted)}
.controls select{width:100%;margin-top:5px;color:var(--ink)}
#staffWrap{overflow-x:auto;margin-top:6px}
#staff{width:100%;min-width:560px;height:260px;display:block}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
#questionText{font-size:20px;font-weight:800;line-height:1.45}
#courseBadge{display:inline-block;font-size:12px;background:#eef2ff;color:#3646a5;padding:5px 9px;border-radius:999px;margin-bottom:5px}
#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.choice{border:1px solid var(--line);background:#fff;text-align:left;min-height:54px}
.choice.correct{background:#eaf8f0;border-color:#7cc7a2}
.choice.wrong{background:#fff0ef;border-color:#e5a19b}
#feedback{min-height:30px;margin-top:12px;font-weight:800}
#explanation{margin-top:8px;padding:12px 14px;background:#f8fafc;border-left:4px solid #a6b6df;border-radius:8px;line-height:1.65}
.small{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.progress{height:10px;background:#e9edf5;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);width:0%;transition:.2s}
.timerBox{min-width:116px;text-align:center}
.timerNumber{font-weight:900;font-size:28px;line-height:1}
.timerLabel{font-size:11px;color:var(--muted);margin-top:4px}
.timerTrack{height:7px;background:#e9edf5;border-radius:999px;overflow:hidden;margin-top:7px}
#timerBar{height:100%;width:100%;background:var(--accent);transition:width .1s linear}
.visualCard{min-height:145px;display:flex;align-items:center;justify-content:center;text-align:center;margin-top:6px}
.symbolBig{font-family:"Noto Music","Segoe UI Symbol","Times New Roman",serif;font-size:92px;line-height:1.05}
.termBig{font-family:Georgia,"Times New Roman",serif;font-size:52px;font-style:italic}
.historyEra{font-size:16px;color:var(--muted);margin-bottom:8px}
.historyBig{font-size:30px;font-weight:800;line-height:1.45;max-width:720px}
.germanBig{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;line-height:1.35;max-width:760px;padding:0 10px}
.germanKind{display:inline-block;margin-top:7px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 7px}
.germanContext{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.35}

.resultTitle{margin-top:0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 20px}
@media(max-width:680px){
  .app{
    padding-top:max(34px, calc(8px + env(safe-area-inset-top)));
    padding-right:max(10px, env(safe-area-inset-right));
    padding-bottom:max(12px, env(safe-area-inset-bottom));
    padding-left:max(10px, env(safe-area-inset-left));
  }
  header{margin-bottom:8px}
  h1{font-size:19px}
  header .small{font-size:11px}
  .version{font-size:10px;padding:4px 7px}
  .card{padding:11px;border-radius:14px;margin-bottom:8px}
  button{padding:9px 11px;border-radius:10px}
  .stats{grid-template-columns:repeat(2,1fr);gap:6px}
  .stat{padding:8px;border-radius:10px;font-size:12px}
  .stat b{font-size:18px;margin-top:2px}
  .controls{grid-template-columns:1fr;gap:7px}
  .controls select{margin-top:3px;padding:8px 10px}
  .qhead{align-items:flex-start;gap:8px}
  #courseBadge{font-size:10px;padding:3px 7px;margin-bottom:2px}
  #progressLabel{font-size:12px;line-height:1.2}
  #questionText{font-size:17px;line-height:1.35;margin-top:2px}
  .timerBox{min-width:76px}
  .timerNumber{font-size:22px}
  .timerLabel{font-size:9px;margin-top:2px}
  .timerTrack{height:5px;margin-top:4px}
  .progress{height:7px}
  #staffWrap{margin-top:2px}
  #staff{height:190px}
  .visualCard{min-height:76px;margin-top:2px}
  .historyEra{font-size:12px;margin-bottom:2px}
  .historyBig{font-size:22px;line-height:1.2}
  .symbolBig{font-size:60px}
  .termBig{font-size:34px}
  #audioRow{margin-top:0}
  #choices{grid-template-columns:1fr;gap:6px;margin-top:7px}
  .choice{min-height:42px;padding:8px 10px;line-height:1.35;border-radius:10px}
  #feedback{min-height:20px;margin-top:7px;font-size:15px}
  #explanation{margin-top:5px;padding:8px 10px;border-left-width:3px;border-radius:7px;line-height:1.45;font-size:13px}
  #quizCard>.row:last-child{margin-top:6px!important;gap:6px;padding-right:64px}
  #quitBtn,#nextBtn{padding:9px 12px;font-size:14px}
  footer{padding:5px 0 10px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>Music Quiz Trainer</h1>
    <div class="small">楽譜・音楽史・合唱・ドイツ語・音楽記号・調号を10秒でトレーニング</div>
  </div>
  <span class="version">Ver. 0.5.1</span>
</header>

<section class="card" id="homeCard">
  <div class="controls">
    <label>コース
      <select id="courseMode">
        <option value="mix" selected>総合クイズ</option>
        <option value="note">音名クイズ</option>
        <option value="history">音楽史クイズ</option>
        <option value="japanChoral">日本の合唱クイズ</option>
        <option value="worldChoral">世界の合唱クイズ</option>
        <option value="tada">多田武彦クイズ</option>
        <option value="german">ドイツ語和訳クイズ（2資料総合）</option>
        <option value="germanWords">ドイツ語 単語・語句（2資料総合）</option>
        <option value="germanFrohlich">Fröhlich im Maien 和訳</option>
        <option value="germanVor">Vor den Türen 和訳</option>
        <option value="symbol">音楽記号クイズ</option>
        <option value="key">調号クイズ</option>
      </select>
    </label>
    <label>難易度
      <select id="difficulty">
        <option value="easy">初級</option>
        <option value="normal" selected>中級</option>
        <option value="hard">上級</option>
      </select>
    </label>
    <label>音部記号
      <select id="clefMode">
        <option value="treble">ト音記号</option>
        <option value="bass">ヘ音記号</option>
        <option value="mix" selected>両方</option>
      </select>
    </label>
  </div>

  <div style="height:16px"></div>
  <div class="stats">
    <div class="stat">累計問題<b id="totalCount">0</b></div>
    <div class="stat">正解<b id="correctCount">0</b></div>
    <div class="stat">正答率<b id="accuracy">0%</b></div>
    <div class="stat">最高連続<b id="bestStreak">0</b></div>
  </div>
  <div style="height:16px"></div>
  <div class="row">
    <button class="primary" id="startBtn">10問クイズを開始</button>
    <button id="resetBtn">学習記録をリセット</button>
  </div>
  <p class="small" style="margin-bottom:0">各問題の回答時間は10秒です。時間切れは不正解となり、正解と解説を表示します。</p>
  <p class="small" id="bankInfo" style="margin-bottom:0;font-weight:700"></p>
</section>

<section class="card hidden" id="quizCard">
  <div class="qhead">
    <div style="flex:1">
      <span id="courseBadge">音名</span>
      <div class="small" id="progressLabel">1 / 10</div>
      <div id="questionText">この音は何でしょう？</div>
    </div>
    <div class="timerBox">
      <div class="timerNumber"><span id="timerNumber">10</span>秒</div>
      <div class="timerLabel">回答時間</div>
      <div class="timerTrack"><div id="timerBar"></div></div>
    </div>
  </div>
  <div style="height:7px"></div>
  <div class="progress"><div id="progressBar"></div></div>

  <div id="staffWrap" class="hidden">
    <svg id="staff" viewBox="0 0 760 260" role="img" aria-label="五線譜"></svg>
  </div>

  <div id="visualArea" class="visualCard hidden"></div>

  <div class="row" id="audioRow" style="justify-content:center">
    <button id="playBtn">▶ 音を聴く</button>
  </div>

  <div id="choices"></div>
  <div id="feedback"></div>
  <div id="explanation" class="hidden"></div>
  <div class="row" style="justify-content:space-between;margin-top:10px">
    <button id="quitBtn">終了</button>
    <button class="primary hidden" id="nextBtn">次の問題</button>
  </div>
</section>

<section class="card hidden" id="resultCard">
  <h2 class="resultTitle">結果</h2>
  <div class="stats">
    <div class="stat">正解<b id="resultCorrect">0</b></div>
    <div class="stat">問題数<b>10</b></div>
    <div class="stat">正答率<b id="resultAccuracy">0%</b></div>
    <div class="stat">今回連続<b id="resultStreak">0</b></div>
  </div>
  <div style="height:16px"></div>
  <div class="row">
    <button class="primary" id="retryBtn">もう10問</button>
    <button id="homeBtn">ホームに戻る</button>
  </div>
</section>

<footer>学習記録はこの端末のブラウザ内に保存されます。</footer>
</div>

<script>

    normal:[["C",2],["D",2],["E",2],["F",2],["G",2],["A",2],["B",2],["C",3],["D",3],["E",3],["F",3],["G",3],["A",3],["B",3],["C",4],["D",4],["E",4]],
    hard:[["A",1],["B",1],["C",2],["D",2],["E",2],["F",2],["G",2],["A",2],["B",2],["C",3],["D",3],["E",3],["F",3],["G",3],["A",3],["B",3],["C",4],["D",4],["E",4],["F",4]]

const HISTORY_ERAS=["中世","ルネサンス","バロック","古典派","ロマン派","近代・20世紀"];

function buildHistoryQuestions(){
  const out=[...historyFixed];
  const n=composerData.length;
  const composerDistractors=(i)=>[composerData[(i+7)%n].name,composerData[(i+19)%n].name,composerData[(i+37)%n].name];
  const workDistractors=(i)=>[composerData[(i+5)%n].works[0],composerData[(i+17)%n].works[0],composerData[(i+31)%n].works[0]];
  composerData.forEach((c,i)=>{
    const eraOthers=HISTORY_ERAS.filter(e=>e!==c.era);
    const eraChoices=[c.era,eraOthers[i%eraOthers.length],eraOthers[(i+2)%eraOthers.length],eraOthers[(i+4)%eraOthers.length]]
      .filter((v,idx,a)=>a.indexOf(v)===idx).slice(0,4);
    while(eraChoices.length<4){
      const add=eraOthers.find(x=>!eraChoices.includes(x)); if(!add) break; eraChoices.push(add);
    }
    out.push({
      id:`${c.id}e`,level:c.level,era:c.era,
      q:`${c.name}が主に活躍した時代は？`,correct:c.era,choices:eraChoices,
      exp:`${c.name}は、音楽史では主に「${c.era}」の作曲家として学びます。`
    });
    c.works.forEach((w,wi)=>{
      out.push({
        id:`${c.id}w${wi}`,level:c.level,era:c.era,
        q:`${w}を作曲したのは？`,correct:c.name,
        choices:[c.name,...composerDistractors(i+wi)].filter((v,idx,a)=>a.indexOf(v)===idx).slice(0,4),
        exp:`${w}は${c.name}の作品です。`
      });
    });
    out.push({
      id:`${c.id}m`,level:c.level,era:c.era,
      q:`次のうち、${c.name}の作品は？`,correct:c.works[0],
      choices:[c.works[0],...workDistractors(i)].filter((v,idx,a)=>a.indexOf(v)===idx).slice(0,4),
      exp:`${c.works[0]}は${c.name}の代表的な作品の一つです。`
    });
  });
  return out;

function buildSymbolQuestions(){
  const allMeanings=[...new Set(symbolTerms.map(x=>x.meaning))];
  return symbolTerms.map((s,i)=>{
    const local=[...new Set(symbolTerms.filter(x=>x.category===s.category&&x.meaning!==s.meaning).map(x=>x.meaning))];
    const global=allMeanings.filter(x=>x!==s.meaning&&!local.includes(x));
    const choices=[s.meaning,...local.slice(i%Math.max(1,local.length)).concat(local.slice(0,i%Math.max(1,local.length))).slice(0,3)];
    for(const g of global){
      if(choices.length>=4)break;
      if(!choices.includes(g))choices.push(g);
    }
    return {
      id:s.id,level:s.level,display:s.display,kind:s.kind,
      q:`「${s.display}」の意味として最も適切なのは？`,
      correct:s.meaning,choices:choices.slice(0,4),exp:s.exp
    };
  });
}

  const t=svgEl("text",{x,y,...attrs});t.textContent=text;parent.appendChild(t);return t;
}
function diatonicIndex(note,oct){return oct*7+["C","D","E","F","G","A","B"].indexOf(note)}
function noteY(note,oct,clef){
  const top=84,gap=22,bottom=top+gap*4;
  const ref=clef==="treble"?diatonicIndex("E",4):diatonicIndex("G",2);
  return bottom-(diatonicIndex(note,oct)-ref)*(gap/2);
}
function drawBaseStaff(clef,variant="standard"){
  const s=$("staff");s.innerHTML="";
  const top=84,gap=22,left=88,right=704;
  for(let i=0;i<5;i++){
    s.appendChild(svgEl("line",{
      x1:left,y1:top+i*gap,x2:right,y2:top+i*gap,
      stroke:"#24211e","stroke-width":"1.7"
    }));
  }

  // 音名クイズ専用の音部記号調整。
  // 第2線は画面上から2本目（top + gap）。
  const secondLineY=top+gap;
  const noteMode=variant==="note";

  if(clef==="treble"){
    // ト音記号：
    // 五線の上下から大きくはみ出すサイズにし、
    // 上側の交差部分が第2線付近に重なるように配置する。
    const size=noteMode?158:116;
    const x=noteMode?86:101;
    const y=noteMode
      ? secondLineY+size*0.315
      : top+62;
    drawText(s,"𝄞",x,y,{
      "font-size":size,
      "font-family":"'Noto Music','Segoe UI Symbol',serif",
      fill:"#24211e"
    });
  }else{
    // ヘ音記号：
    // 左側の大きな黒丸の中心が第2線の中心に重なるように配置する。
    const size=noteMode?92:88;
    const x=noteMode?94:101;
    const y=noteMode
      ? secondLineY+size*0.365
      : top+55;
    drawText(s,"𝄢",x,y,{
      "font-size":size,
      "font-family":"'Noto Music','Segoe UI Symbol',serif",
      fill:"#24211e"
    });
  }

  return {s,top,gap,left,right};
}
function drawNoteQuestion(q){
  const {s,top,gap}=drawBaseStaff(q.clef,"note");
  const y=noteY(q.note,q.oct,q.clef),x=440,bottom=top+gap*4;
  if(y>bottom){
    for(let ly=bottom+gap;ly<=y+1;ly+=gap)s.appendChild(svgEl("line",{x1:x-30,y1:ly,x2:x+30,y2:ly,stroke:"#24211e","stroke-width":"1.7"}));
  }
  if(y<top){
    for(let ly=top-gap;ly>=y-1;ly-=gap)s.appendChild(svgEl("line",{x1:x-30,y1:ly,x2:x+30,y2:ly,stroke:"#24211e","stroke-width":"1.7"}));
  }
  const g=svgEl("g",{transform:`translate(${x} ${y}) rotate(-18)`});
  g.appendChild(svgEl("ellipse",{cx:0,cy:0,rx:13,ry:9,fill:"#111"}));s.appendChild(g);
  s.appendChild(svgEl("line",{x1:x+11,y1:y-1,x2:x+11,y2:y-66,stroke:"#111","stroke-width":"3"}));
}
function drawKeySignature(q){
  const {s,top}=drawBaseStaff(q.clef);
  const sharpTreble=[["F",5],["C",5],["G",5],["D",5],["A",4],["E",5],["B",4]];
  const flatTreble =[["B",4],["E",5],["A",4],["D",5],["G",4],["C",5],["F",4]];
  const sharpBass=[["F",3],["C",3],["G",3],["D",3],["A",2],["E",3],["B",2]];
  const flatBass =[["B",2],["E",3],["A",2],["D",3],["G",2],["C",3],["F",2]];
  const isSharp=q.sig>0,count=Math.abs(q.sig);
  const list=q.clef==="treble"?(isSharp?sharpTreble:flatTreble):(isSharp?sharpBass:flatBass);
  for(let i=0;i<count;i++){
    const [n,o]=list[i],x=205+i*34,y=noteY(n,o,q.clef)+10;
    drawText(s,isSharp?"♯":"♭",x,y,{
      "font-size":38,
      "font-family":"'Noto Music','Segoe UI Symbol',serif",
      "text-anchor":"middle",fill:"#24211e"
    });
  }
  if(count===0){
    drawText(s,"（調号なし）",345,220,{"font-size":18,"font-family":"sans-serif",fill:"#697386"});
  }
}
function midi(note,oct){
  const idx={"C":0,"D":2,"E":4,"F":5,"G":7,"A":9,"B":11}[note];
  return 12*(oct+1)+idx;
}
function playCurrent(){
  if(!session.q||session.q.type!=="note")return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  const ctx=new AudioCtx(),osc=ctx.createOscillator(),gain=ctx.createGain();
  const f=440*Math.pow(2,(midi(session.q.note,session.q.oct)-69)/12);
  osc.type="sine";osc.frequency.value=f;
  gain.gain.setValueAtTime(.0001,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.32,ctx.currentTime+.02);
  gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.95);
  osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+1.05);
}
function chooseClef(){
  const m=$("clefMode").value;
  return m==="mix"?(Math.random()<.5?"treble":"bass"):m;
}
function levelLimit(){return $("difficulty").value==="easy"?1:$("difficulty").value==="normal"?2:3}
function uniqueBankPick(bank,prefix){
  const pool=bank.filter(x=>x.level<=levelLimit()&&!session.used.has(x.id));
  const fallback=bank.filter(x=>x.level<=levelLimit());
  const q=pick(pool.length?pool:fallback);
  session.used.add(q.id);
  return q;
}
function makeNoteQuestion(){
  const clef=chooseClef(),diff=$("difficulty").value,pool=ranges[clef][diff];
  const [note,oct]=pick(pool);
  const bases=["C","D","E","F","G","A","B"],choices=new Set([note]);
  while(choices.size<4)choices.add(pick(bases));
  return {type:"note",clef,note,oct,correct:note,choices:shuffle([...choices]),
    question:"この音は何でしょう？",
    explanation:`${clef==="treble"?"ト音記号":"ヘ音記号"}で、この音は ${note}${oct}（${SOLFEGE[note]}）です。`};
}
function makeHistoryQuestion(){
  const x=uniqueBankPick(historyQuestions,"h");
  return {type:"history",correct:x.correct,choices:shuffle(x.choices),question:x.q,explanation:x.exp,era:x.era};
}
function makeSymbolQuestion(){
  const x=uniqueBankPick(symbolQuestions,"s");
  return {type:"symbol",correct:x.correct,choices:shuffle(x.choices),question:x.q,explanation:x.exp,display:x.display,kind:x.kind};
}
function makeJapanChoralQuestion(){
  const x=uniqueBankPick(japanChoralQuestions,"jc");
  return {type:"japanChoral",correct:x.correct,choices:shuffle(x.choices),question:x.q,explanation:x.exp,section:x.section};
}
function makeWorldChoralQuestion(){
  const x=uniqueBankPick(worldChoralQuestions,"wc");
  return {type:"worldChoral",correct:x.correct,choices:shuffle(x.choices),question:x.q,explanation:x.exp,section:x.section};
}
function makeTadaQuestion(){
  const x=uniqueBankPick(tadaQuestions,"tc");
  return {type:"tada",correct:x.correct,choices:shuffle(x.choices),question:x.q,explanation:x.exp,section:x.section};
}
function makeGermanFromBank(bank,typeName){
  const x=uniqueBankPick(bank,typeName);
  return {type:typeName,correct:x.correct,choices:shuffle(x.choices),
    question:x.kind==="単語・語句"?"このドイツ語の語・語句を資料の文脈で和訳すると？":"このドイツ語を資料の和訳にすると？",
    explanation:x.exp,source:x.source,kind:x.kind,german:x.german,context:x.context||""};
}
function makeGermanQuestion(){return makeGermanFromBank(germanTranslationQuestions,"german");}
function makeGermanWordsQuestion(){return makeGermanFromBank(germanWordQuestions,"germanWords");}
function makeGermanFrohlichQuestion(){return makeGermanFromBank(germanFrohlichQuestions,"germanFrohlich");}
function makeGermanVorQuestion(){return makeGermanFromBank(germanVorQuestions,"germanVor");}
function makeKeyQuestion(){
  const pool=keyDefs.filter(x=>x.level<=levelLimit());
  const variants=["major","minor","count","pair"];
  const all=[];
  pool.forEach(x=>variants.forEach(mode=>all.push({x,mode,token:`k${x.sig}:${mode}`})));
  const candidates=all.filter(v=>!session.used.has(v.token));
  const chosen=pick(candidates.length?candidates:all);
  const x=chosen.x,mode=chosen.mode;
  session.used.add(chosen.token);
  const clef=chooseClef();

  if(mode==="major"||mode==="minor"){
    const field=mode;
    const wrongPool=shuffle(pool.filter(y=>y!==x).map(y=>y[field]));
    return {type:"key",sig:x.sig,clef,correct:x[field],
      choices:shuffle([x[field],...wrongPool.slice(0,3)]),
      question:`この調号が示す${mode==="minor"?"短調":"長調"}は？`,
      explanation:`この調号は ${x.major} と、その平行調である ${x.minor} に対応します。`};
  }

  if(mode==="count"){
    const count=Math.abs(x.sig);
    const sym=x.sig>0?"♯":x.sig<0?"♭":"";
    const correct=count===0?"0個（調号なし）":`${sym}${count}個`;
    const opts=new Set([correct]);
    if(count===0){
      ["♯1個","♭1個","♯2個","♭2個"].forEach(v=>opts.add(v));
    }else{
      const opp=sym==="♯"?"♭":"♯";
      [count-1,count+1,count-2,count+2].filter(n=>n>=1&&n<=7).forEach(n=>opts.add(`${sym}${n}個`));
      opts.add(`${opp}${count}個`);
      opts.add("0個（調号なし）");
    }
    return {type:"key",sig:x.sig,clef,correct,
      choices:shuffle([...opts].slice(0,4)),
      question:"この調号に使われている♯・♭の数は？",
      explanation:`${correct}です。この調号は ${x.major} / ${x.minor} に対応します。`};
  }

  const correct=`${x.major} / ${x.minor}`;
  const wrongPool=shuffle(pool.filter(y=>y!==x).map(y=>`${y.major} / ${y.minor}`));
  return {type:"key",sig:x.sig,clef,correct,
    choices:shuffle([correct,...wrongPool.slice(0,3)]),
    question:"この調号に対応する長調と短調の組み合わせは？",
    explanation:`正しい組み合わせは ${x.major} と ${x.minor} です。両者は同じ調号をもつ平行調です。`};
}
function makeQuestion(){
  let type=session.course;
  if(type==="mix"){
    const pattern=["note","history","japanChoral","worldChoral","tada","german","symbol","key","german","tada"];
    type=pattern[session.index % pattern.length];
  }
  if(type==="note")return makeNoteQuestion();
  if(type==="history")return makeHistoryQuestion();
  if(type==="japanChoral")return makeJapanChoralQuestion();
  if(type==="worldChoral")return makeWorldChoralQuestion();
  if(type==="tada")return makeTadaQuestion();
  if(type==="german")return makeGermanQuestion();
  if(type==="germanWords")return makeGermanWordsQuestion();
  if(type==="germanFrohlich")return makeGermanFrohlichQuestion();
  if(type==="germanVor")return makeGermanVorQuestion();
  if(type==="symbol")return makeSymbolQuestion();
  return makeKeyQuestion();
}
function setQuestionVisual(q){
  $("staffWrap").classList.add("hidden");
  $("visualArea").classList.add("hidden");
  $("audioRow").classList.add("hidden");
  if(q.type==="note"){
    $("staffWrap").classList.remove("hidden");$("audioRow").classList.remove("hidden");drawNoteQuestion(q);
  }else if(q.type==="key"){
    $("staffWrap").classList.remove("hidden");drawKeySignature(q);
  }else if(q.type==="symbol"){
    const v=$("visualArea");v.classList.remove("hidden");
    v.innerHTML=`<div class="${q.kind==="symbol"?"symbolBig":"termBig"}">${q.display}</div>`;
  }else if(q.type==="japanChoral"||q.type==="worldChoral"||q.type==="tada"){
    const v=$("visualArea");v.classList.remove("hidden");
    const title=q.type==="japanChoral"?"日本の合唱":q.type==="worldChoral"?"世界の合唱":"多田武彦";
    v.innerHTML=`<div><div class="historyEra">${q.section||"合唱"}</div><div class="historyBig">${title}</div></div>`;
  }else if(q.type==="german"||q.type==="germanWords"||q.type==="germanFrohlich"||q.type==="germanVor"){
    const v=$("visualArea");v.classList.remove("hidden");
    v.innerHTML=`<div><div class="historyEra">${q.source}</div><div class="germanBig">${q.german}</div>${q.context?`<div class="germanContext">文脈：${q.context}</div>`:""}<div class="germanKind">${q.kind}</div></div>`;
  }else{
    const v=$("visualArea");v.classList.remove("hidden");
    v.innerHTML=`<div><div class="historyEra">${q.era}</div><div class="historyBig">音楽史</div></div>`;
  }
}
function startTimer(){
  stopTimer();timeLeft=10;timerStartedAt=performance.now();
  updateTimerDisplay(10,100);
  timerId=setInterval(()=>{
    if(session.answered){stopTimer();return}
    const elapsed=(performance.now()-timerStartedAt)/1000;
    const remaining=Math.max(0,10-elapsed);
    timeLeft=remaining;
    updateTimerDisplay(Math.ceil(remaining),(remaining/10)*100);
    if(remaining<=0){stopTimer();answer(null,null,true)}
  },80);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function updateTimerDisplay(sec,pct){
  $("timerNumber").textContent=sec;
  $("timerBar").style.width=`${Math.max(0,pct)}%`;
  $("timerBar").style.background=pct<=30?"var(--ng)":pct<=60?"var(--warn)":"var(--accent)";
}
function renderQuestion(){
  session.answered=false;session.q=makeQuestion();
  $("courseBadge").textContent=COURSE_LABELS[session.q.type];
  $("progressLabel").textContent=`${session.index+1} / 10`;
  $("progressBar").style.width=`${session.index*10}%`;
  $("questionText").textContent=session.q.question;
  $("feedback").textContent="";
  $("explanation").textContent="";$("explanation").classList.add("hidden");
  $("nextBtn").classList.add("hidden");
  setQuestionVisual(session.q);
  const c=$("choices");c.innerHTML="";
  session.q.choices.forEach((value,i)=>{
    const b=document.createElement("button");b.className="choice";b.dataset.value=value;
    b.innerHTML=`<b>${i+1}.</b> ${value}`;
    b.onclick=()=>answer(value,b,false);c.appendChild(b);
  });
  startTimer();
}
function answer(value,button,isTimeout=false){
  if(session.answered)return;
  session.answered=true;stopTimer();
  const ok=!isTimeout&&value===session.q.correct;
  [...$("choices").children].forEach(b=>{
    if(b.dataset.value===session.q.correct)b.classList.add("correct");
    b.disabled=true;
  });
  stats.total=(stats.total||0)+1;
  if(ok){
    session.correct++;session.streak++;session.bestSessionStreak=Math.max(session.bestSessionStreak,session.streak);
    stats.correct=(stats.correct||0)+1;stats.currentStreak=(stats.currentStreak||0)+1;
    stats.bestStreak=Math.max(stats.bestStreak||0,stats.currentStreak);
    if(button)button.classList.add("correct");
    $("feedback").textContent="正解！";
    $("feedback").style.color="var(--ok)";
  }else{
    session.streak=0;stats.currentStreak=0;
    if(button)button.classList.add("wrong");
    $("feedback").textContent=isTimeout?`時間切れ。正解は「${session.q.correct}」です。`:`不正解。正解は「${session.q.correct}」です。`;
    $("feedback").style.color="var(--ng)";
  }
  $("explanation").textContent=session.q.explanation;
  $("explanation").classList.remove("hidden");
  saveStats();
  $("nextBtn").textContent=session.index===9?"結果を見る":"次の問題";
  $("nextBtn").classList.remove("hidden");
}
function start(){
  stopTimer();
  session={index:0,correct:0,streak:0,bestSessionStreak:0,answered:false,q:null,used:new Set(),course:$("courseMode").value};
  $("homeCard").classList.add("hidden");$("resultCard").classList.add("hidden");$("quizCard").classList.remove("hidden");
  renderQuestion();
}
function next(){if(session.index>=9){finish();return}session.index++;renderQuestion()}
function finish(){
  stopTimer();$("quizCard").classList.add("hidden");$("resultCard").classList.remove("hidden");
  $("resultCorrect").textContent=session.correct;
  $("resultAccuracy").textContent=Math.round(session.correct/10*100)+"%";
  $("resultStreak").textContent=session.bestSessionStreak;
}
function home(){stopTimer();$("quizCard").classList.add("hidden");$("resultCard").classList.add("hidden");$("homeCard").classList.remove("hidden")}
$("startBtn").onclick=start;$("retryBtn").onclick=start;$("homeBtn").onclick=home;$("nextBtn").onclick=next;
$("playBtn").onclick=playCurrent;$("quitBtn").onclick=home;
$("resetBtn").onclick=()=>{if(confirm("学習記録をリセットしますか？")){stats={total:0,correct:0,bestStreak:0,currentStreak:0};saveStats()}};
document.addEventListener("keydown",e=>{
  if($("quizCard").classList.contains("hidden"))return;
  if(e.code==="Space"&&session.q?.type==="note"){e.preventDefault();playCurrent()}
  if(["Digit1","Digit2","Digit3","Digit4"].includes(e.code)&&!session.answered){
    const idx=Number(e.code.slice(-1))-1,btn=$("choices").children[idx];if(btn)btn.click();
  }
  if(e.code==="Enter"&&!$("nextBtn").classList.contains("hidden"))next();
});
